name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodlia-cli
      # Sibling repositories use the branch with this branch's name when it exists, so
      # coordinated changes are tested together; otherwise main. The plugin uses the
      # pinned release tag, or that branch until the tag is published.
      - name: Resolve sibling refs
        id: refs
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          pick() {
            if git ls-remote --exit-code --heads "https://github.com/gafapa/$1.git" "$branch" >/dev/null 2>&1; then echo "$branch"; else echo main; fi
          }
          release="$(node -p "require('./moodlia-cli/package.json').moodliaPlugin.contractRelease")"
          if git ls-remote --exit-code --tags https://github.com/gafapa/moodle-local_moodlia.git "refs/tags/$release" >/dev/null 2>&1; then
            plugin="$release"
          else
            plugin="$(pick moodle-local_moodlia)"
          fi
          echo "core=$(pick moodle-core-cli)" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "moodle-core-cli@$(pick moodle-core-cli), moodle-local_moodlia@$plugin"
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-core-cli
          ref: ${{ steps.refs.outputs.core }}
          path: moodle-core-cli
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-local_moodlia
          ref: ${{ steps.refs.outputs.plugin }}
          path: moodlia-moodle-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Core package dependencies
        working-directory: moodle-core-cli
        run: npm ci
      - name: Install preview Core dependency
        working-directory: moodlia-cli
        run: |
          npm pkg set dependencies.moodle-core-cli="file:../moodle-core-cli"
          npm install --ignore-scripts
      - run: npm run check
        working-directory: moodlia-cli
      - run: npm run test:coverage
        working-directory: moodlia-cli
      - run: npm run contract:check
        working-directory: moodlia-cli
      - run: npm run pack:check
        working-directory: moodlia-cli
      - run: npm audit --audit-level=high
        working-directory: moodlia-cli
