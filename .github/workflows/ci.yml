name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodlia-cli
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-core-cli
          path: moodle-core-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install preview Core dependency
        working-directory: moodlia-cli
        run: |
          npm pkg set dependencies.moodle-core-cli="file:../moodle-core-cli"
          npm install --ignore-scripts
      - run: npm run check
        working-directory: moodlia-cli
      - run: npm run pack:check
        working-directory: moodlia-cli
      - run: npm audit --audit-level=high
        working-directory: moodlia-cli
