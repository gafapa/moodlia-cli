name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodlia-cli
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-core-cli
          path: moodle-core-cli
      - name: Read the pinned plugin release
        id: plugin
        shell: bash
        run: echo "ref=$(node -p "require('./moodlia-cli/package.json').moodliaPlugin.contractRelease")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-local_moodlia
          ref: ${{ steps.plugin.outputs.ref }}
          path: moodlia-moodle-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Core package dependencies
        working-directory: moodle-core-cli
        run: npm ci
      - name: Install preview Core dependency
        working-directory: moodlia-cli
        run: |
          npm pkg set dependencies.moodle-core-cli="file:../moodle-core-cli"
          npm install --ignore-scripts
      - run: npm run check
        working-directory: moodlia-cli
      - run: npm run test:coverage
        working-directory: moodlia-cli
      - run: npm run contract:check
        working-directory: moodlia-cli
      - run: npm run pack:check
        working-directory: moodlia-cli
      - run: npm audit --audit-level=high
        working-directory: moodlia-cli
