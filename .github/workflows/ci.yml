name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix browser
      - run: node browser/node_modules/playwright/cli.js install --with-deps chromium
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:webmcp:browser
      - if: runner.os == 'Windows'
        run: npm run test:webmcp:browser

  # This repository alone, against the published moodle-core-cli in package-lock.json.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:coverage:browser
      - run: npm run pack:check
      - run: npm audit --audit-level=high

  # Integration with sibling sources: moodle-core-cli from the branch with this branch's
  # name when it exists, otherwise main, and the plugin contract at the pinned release
  # (or that branch until the tag is published).
  siblings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodlia-cli
      - name: Resolve sibling refs
        id: refs
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          pick() {
            if git ls-remote --exit-code --heads "https://github.com/gafapa/$1.git" "$branch" >/dev/null 2>&1; then echo "$branch"; else echo main; fi
          }
          release="$(node -p "require('./moodlia-cli/package.json').moodliaPlugin.contractRelease")"
          if git ls-remote --exit-code --tags https://github.com/gafapa/moodle-local_moodlia.git "refs/tags/$release" >/dev/null 2>&1; then
            plugin="$release"
          else
            plugin="$(pick moodle-local_moodlia)"
          fi
          echo "core=$(pick moodle-core-cli)" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "moodle-core-cli@$(pick moodle-core-cli), moodle-local_moodlia@$plugin"
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-core-cli
          ref: ${{ steps.refs.outputs.core }}
          path: moodle-core-cli
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-local_moodlia
          ref: ${{ steps.refs.outputs.plugin }}
          path: moodlia-moodle-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Core from source
        working-directory: moodle-core-cli
        run: npm ci
      - name: Use the Core checkout
        working-directory: moodlia-cli
        run: |
          npm pkg set dependencies.moodle-core-cli="file:../moodle-core-cli"
          npm install --ignore-scripts
      - run: npm run check
        working-directory: moodlia-cli
      - run: npm run contract:check
        working-directory: moodlia-cli
